[project]
name = "torch-einops-kit"
version = "0.1.9"
description = "Typed tensor-shaping, masking, padding, device-routing, and checkpoint utilities for PyTorch and `einops`. A superset of `lucidrains/torch-einops-utils` with similar utilities from other lucidrains packages. Adds strict typing, extensive tests, and comprehensive docstrings."
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
maintainers = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
keywords = [
  "artificial intelligence",
  "einops",
  "machine learning",
  "pytorch",
  "torch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "einops>=0.8.2",
  "huntermakespy>=0.7.0",
  "torch>=2.0.0",
  "typing-extensions>=4.0.0",
]

[project.urls]
Context7 = "https://context7.com/hunterhogan/torch_einops_kit"
Donate = "https://www.patreon.com/integrated"
Download = "https://pypi.org/project/torch_einops_kit"
Homepage = "https://github.com/hunterhogan/torch_einops_kit"
Issues = "https://github.com/hunterhogan/torch_einops_kit/issues"
Repository = "https://github.com/hunterhogan/torch_einops_kit.git"

[project.optional-dependencies]
development = ["pytest-cov"]
testing = ["more-itertools", "numpy>=2.0.0", "pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage]
report = { ignore_errors = false }
run = { branch = true, data_file = "tests/coverage/.coverage", omit = [
  "tests/*"
], source = ["."] }

[tool.pytest]
addopts = ["--color=yes"]
log_auto_indent = "On"
testpaths = ["tests"]

[tool.updateCitation]
filenameCitationDOTcff = "CITATION.cff"
pathFilenameCitationSSOT = "citations/CITATION.cff"
